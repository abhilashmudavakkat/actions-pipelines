name: Python CI pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      
      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m pytest


